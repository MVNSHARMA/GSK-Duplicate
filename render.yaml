services:
  - type: web
    name: gsk-automotive-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "GSK Automotive"
      - key: BREVO_REPLY_TO_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        value: "admin@gskautomotive.com"
      - key: DEFAULT_ADMIN_EMAIL
        value: "admin@gskautomotive.com"
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true

